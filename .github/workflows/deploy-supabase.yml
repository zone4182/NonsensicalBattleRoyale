name: Deploy Supabase

# Pushes battle_royale schema migrations and Edge Functions to the shared MoodTracker
# Supabase project (isolated via its own schema/functions -- see ARCHITECTURE.md).
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: zmwsmxulcbhwjvnyvihb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        # --include-all: without it, a migration file whose timestamp sorts before the
        # latest one already applied remotely makes the CLI refuse the whole push
        # (LegacyDbPushMissingRemoteError) instead of just applying what's missing.
        # That's exactly what silently blocked every deploy (migrations AND, since this
        # step failing stops the job, Edge Functions too) from 2026-09-11 onward -- a
        # migration got committed/pushed slightly out of the order its filename
        # timestamp implied. --include-all makes "any local migration not yet applied
        # remotely, in file order" the actual policy, which is what's really wanted here.
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
