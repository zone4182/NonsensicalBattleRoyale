name: Deploy Supabase

# Pushes battle_royale schema migrations and Edge Functions to the shared MoodTracker
# Supabase project (isolated via its own schema/functions -- see ARCHITECTURE.md).
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: zmwsmxulcbhwjvnyvihb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
